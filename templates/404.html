{% extends "base.html" %}
{% block content %}
<div class="center-card">
    <div style="text-align: center; padding: 60px 20px;">
        <i class="fas fa-exclamation-triangle" style="font-size: 80px; color: #ffc300; margin-bottom: 30px;"></i>
        <h2 class="section-title">404 - Page Not Found</h2>
        <div class="products-header-bar"></div>
        
        <p style="color: #aaa; font-size: 18px; margin: 30px 0;">
            The page you're looking for doesn't exist.
        </p>
        
        <div style="margin-top: 40px;">
            <a href="{{ url_for('home') }}" class="btn primary-btn large-btn">Go Home</a>
            <a href="{{ url_for('products') }}" class="btn secondary-btn" style="margin-left: 15px;">Browse Products</a>
        </div>
    </div>
</div>
{% endblock %}
