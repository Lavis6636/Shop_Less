{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <!-- Animated Border -->
        <div class="animated-border"></div>
        
        <div class="auth-content">
            <div class="auth-header">
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to your account</p>
                <div class="auth-header-bar"></div>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="username" placeholder=" " required class="auth-input" id="username">
                        <label for="username" class="floating-label">Username</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" placeholder=" " required class="auth-input" id="password">
                        <label for="password" class="floating-label">Password</label>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">
                    <span class="btn-text">Login</span>
                    <i class="fas fa-arrow-right btn-icon"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? 
                    <a href="{{ url_for('register') }}" class="auth-link">Register here</a>
                </p>
            </div>
            
            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
