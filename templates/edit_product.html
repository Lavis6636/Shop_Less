{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2 class="section-title">Edit Product</h2>
    <div class="products-header-bar"></div>
    
    <div class="form-card">
        <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">SKU</label>
                    <input type="text" name="sku" class="form-input" value="{{ product.sku or '' }}" placeholder="Product SKU">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-input" value="{{ product.name }}" required>
                </div>
                
                <div class="form-group full-width">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-textarea">{{ product.description or '' }}</textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="number" name="price" class="form-input" value="{{ "%.2f"|format(product.base_price) }}" step="0.01" min="0" required>  <!-- Changed product.price to product.base_price -->
                </div>
                
                <div class="form-group">
                    <label class="form-label">Image Filename</label>
                    <input type="text" name="image" class="form-input" value="{{ product.image or '' }}" placeholder="images/filename.jpg">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn primary-btn">Update Product</button>
                <a href="{{ url_for('admin_panel') }}" class="btn secondary-btn">Cancel</a>
            </div>
        </form>
    </div>
    
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="success-message">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
</div>
{% endblock %}
